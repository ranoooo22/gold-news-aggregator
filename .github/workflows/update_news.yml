name: Automatischer News-Aggregator

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser sentence-transformers google-genai

      - name: Aggregator-Skript ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: python aggregator.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.json market_data.json
          git commit -m "Auto-update news and market data" || echo "Keine neuen Änderungen zum Committen."
          git push
