name: Update Gold News

# Triggered externally every 15 min (cron-job.org) and manually when needed.
on:
  workflow_dispatch:

concurrency:
  group: gold-terminal-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model_cache
          key: fastembed-all-MiniLM-L6-v2

      - name: Run aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: python aggregator.py

      - name: Commit and push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # add whichever data files this run produced (optional jobs may not have run)
          for f in data.json oanda_book.json macro.json taker_volume.json comex_volume.json analysis.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update news data"
            # on a conflict keep this run's freshly generated files
            git pull --rebase -X theirs origin main
            git push
          fi
