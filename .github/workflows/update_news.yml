name: Automatischer News-Aggregator

on:
  schedule:
    - cron: '0 * * * *' # Läuft jede Stunde
  workflow_dispatch: # Erlaubt den manuellen Start

permissions:
  contents: write # Erlaubt dem Bot, die data.json zu speichern

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install feedparser sentence-transformers

      - name: Aggregator-Skript ausführen
        run: python aggregator.py

      - name: Änderungen speichern (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automatische News-Aktualisierung" || exit 0
          git push
