<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold News Aggregator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .cluster {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #d4af37; /* Goldener Akzent */
        }
        .cluster h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #2c3e50;
        }
        .date {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .source-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .source-item {
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: baseline;
        }
        .source-badge {
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 10px;
            min-width: 60px;
            text-align: center;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>Wirtschafts- & Gold-News Aggregator</h1>
    <div id="news-container">
        <p class="loading">Lade neueste Nachrichten...</p>
    </div>

    <script>
        // Lade die JSON-Daten
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = ''; // Lade-Text entfernen

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="loading">Aktuell keine Nachrichten verfügbar.</p>';
                    return;
                }

                // Für jeden Cluster eine Karte erstellen
                data.forEach(cluster => {
                    const clusterDiv = document.createElement('div');
                    clusterDiv.className = 'cluster';

                    const title = document.createElement('h2');
                    title.textContent = cluster.cluster_title;
                    clusterDiv.appendChild(title);

                    const date = document.createElement('div');
                    date.className = 'date';
                    date.textContent = "Zuletzt gemeldet: " + cluster.main_date;
                    clusterDiv.appendChild(date);

                    const sourceList = document.createElement('ul');
                    sourceList.className = 'source-list';

                    // Alle Artikel (Quellen) dieses Clusters auflisten
                    cluster.articles.forEach(article => {
                        const li = document.createElement('li');
                        li.className = 'source-item';
                        
                        li.innerHTML = `
                            <span class="source-badge">${article.source}</span>
                            <a href="${article.link}" target="_blank">${article.title}</a>
                        `;
                        sourceList.appendChild(li);
                    });

                    clusterDiv.appendChild(sourceList);
                    container.appendChild(clusterDiv);
                });
            })
            .catch(error => {
                document.getElementById('news-container').innerHTML = '<p class="loading">Fehler beim Laden der Daten.</p>';
                console.error('Error fetching data:', error);
            });
    </script>

</body>
</html>
