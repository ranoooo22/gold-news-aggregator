<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold (XAUUSD) Terminal – DOM & Global/Regional News Aggregator</title>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-panel: #131722;
      --bg-panel-alt: #1e222d;
      --border: #2a2e39;
      --text-main: #d1d4dc;
      --text-muted: #787b86;
      --gold: #f5c542;
      --green: #26a69a;
      --red: #ef5350;
      --blue: #2962ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      padding: 14px;
      line-height: 1.45;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .brand-badge {
      background: rgba(245, 197, 66, 0.15);
      color: var(--gold);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(245, 197, 66, 0.3);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    /* WORKSPACE: CHART + DOM */
    .trading-workspace {
      display: flex;
      gap: 14px;
      height: 540px;
      margin-bottom: 16px;
    }

    @media (max-width: 1024px) {
      .trading-workspace {
        flex-direction: column;
        height: auto;
      }
      .chart-container {
        height: 450px;
      }
      .dom-panel {
        width: 100% !important;
        height: 480px;
      }
    }

    .chart-container {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    /* DOM PANEL */
    .dom-panel {
      width: 330px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      font-size: 12px;
      user-select: none;
    }

    .dom-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .dom-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(38, 166, 154, 0.15);
      color: var(--green);
    }

    .imbalance-container {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .imbalance-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .imbalance-bar {
      height: 6px;
      background: var(--red);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .imbalance-fill-bid {
      background: var(--green);
      height: 100%;
      transition: width 0.15s ease;
    }

    .dom-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 6px 12px;
      color: var(--text-muted);
      font-size: 11px;
      border-bottom: 1px solid var(--bg-panel-alt);
    }

    .dom-columns span:not(:first-child) {
      text-align: right;
    }

    .dom-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .dom-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 2px 12px;
      line-height: 1.35;
      z-index: 1;
      font-variant-numeric: tabular-nums;
    }

    .dom-row span:not(:first-child) {
      text-align: right;
    }

    .dom-depth-bg {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      transition: width 0.1s ease;
    }

    .ask-row .price { color: var(--red); }
    .ask-row .dom-depth-bg { background: rgba(239, 83, 80, 0.16); }

    .bid-row .price { color: var(--green); }
    .bid-row .dom-depth-bg { background: rgba(38, 166, 154, 0.16); }

    .whale-wall {
      font-weight: 700;
      background: rgba(245, 197, 66, 0.12);
    }

    .whale-wall .size::before {
      content: "🐳 ";
      font-size: 10px;
    }

    .dom-spread-box {
      padding: 7px 12px;
      background: var(--bg-panel-alt);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .mid-price {
      font-size: 14px;
      color: #ffffff;
    }

    .spread-val {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* NEWS AGGREGATOR SECTION */
    .news-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .news-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--bg-panel-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--gold);
    }

    .tab-btn.active {
      background: rgba(245, 197, 66, 0.18);
      color: var(--gold);
      border-color: var(--gold);
      font-weight: 600;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
    }

    .refresh-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
    }

    .news-card {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .news-card:hover {
      border-color: #434857;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 8px;
      gap: 6px;
    }

    .source-tag {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .region-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
    }

    .region-west { background: rgba(41, 98, 255, 0.18); color: #82b1ff; }
    .region-gulf { background: rgba(38, 166, 154, 0.18); color: #80cbc4; }
    .region-iran { background: rgba(239, 83, 80, 0.18); color: #ff8a80; }
    .region-israel { background: rgba(171, 71, 188, 0.18); color: #ce93d8; }
    .region-mena { background: rgba(245, 197, 66, 0.18); color: var(--gold); }

    .news-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 8px;
      display: block;
    }

    .news-title:hover {

    .news-bias {

      padding-top: 6px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }
  </style>

  <!-- 2. LIVE ORDERBOOK (DOM) VIA BINANCE WEBSOCKET -->
  <script>
    (function initGoldDOM() {
      const LEVELS = 12;
      const WHALE_MULTIPLIER = 3.2;

      const asksContainer = document.getElementById('dom-asks');
      const bidsContainer = document.getElementById('dom-bids');
      const midPriceEl = document.getElementById('dom-mid-price');
      const spreadEl = document.getElementById('dom-spread');
      const bidPctEl = document.getElementById('bid-pct');
      const askPctEl = document.getElementById('ask-pct');
      const imbalanceFillEl = document.getElementById('imbalance-fill');
      const statusEl = document.getElementById('dom-conn-status');

      function connectWebSocket() {
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/paxgusdt@depth20@100ms');

        ws.onopen = () => {
          statusEl.textContent = 'LIVE (100ms)';
          statusEl.style.color = '#26a69a';
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (!data.bids || !data.asks) return;
          renderOrderBook(data.bids, data.asks);
        };

        ws.onclose = () => {
          statusEl.textContent = 'RECONNECTING...';
          statusEl.style.color = '#ff9800';
          setTimeout(connectWebSocket, 2500);
        };

        ws.onerror = () => ws.close();
      }

      function renderOrderBook(rawBids, rawAsks) {
        const bids = rawBids.slice(0, LEVELS).map(([p, q]) => ({ price: parseFloat(p), qty: parseFloat(q) }));
        const asks = rawAsks.slice(0, LEVELS).map(([p, q]) => ({ price: parseFloat(p), qty: parseFloat(q) }));
        if (!bids.length || !asks.length) return;

        let totalBidQty = 0;
        let totalAskQty = 0;

        bids.forEach(b => {
          totalBidQty += b.qty;
          b.cumUsd = totalBidQty * b.price;
        });

        asks.forEach(a => {
          totalAskQty += a.qty;
          a.cumUsd = totalAskQty * a.price;
        });

        const avgOrderQty = (totalBidQty + totalAskQty) / (bids.length + asks.length);
        const maxCumQty = Math.max(totalBidQty, totalAskQty, 1);

        const totalVolume = totalBidQty + totalAskQty;
        const bidRatio = totalVolume > 0 ? Math.round((totalBidQty / totalVolume) * 100) : 50;
        const askRatio = 100 - bidRatio;

        bidPctEl.textContent = `${bidRatio}% Bids (${totalBidQty.toFixed(1)} oz)`;
        askPctEl.textContent = `${askRatio}% Asks (${totalAskQty.toFixed(1)} oz)`;
        imbalanceFillEl.style.width = `${bidRatio}%`;

        const bestBid = bids[0].price;
        const bestAsk = asks[0].price;
        const midPrice = (bestBid + bestAsk) / 2;
        const spread = bestAsk - bestBid;

        midPriceEl.textContent = midPrice.toFixed(2);
        spreadEl.textContent = `Spread: $${spread.toFixed(2)}`;

        const asksReversed = [...asks].reverse();
        asksContainer.innerHTML = asksReversed.map(a => {
          const depthWidth = Math.min(((a.cumUsd / (maxCumQty * midPrice)) * 100), 100);
          const isWhale = a.qty >= avgOrderQty * WHALE_MULTIPLIER;
          return `
            <div class="dom-row ask-row ${isWhale ? 'whale-wall' : ''}">
              <div class="dom-depth-bg" style="width: ${depthWidth}%;"></div>
              <span class="price">${a.price.toFixed(2)}</span>
              <span class="size">${a.qty.toFixed(3)}</span>
              <span>${formatUsd(a.cumUsd)}</span>
            </div>
          `;
        }).join('');

        bidsContainer.innerHTML = bids.map(b => {
          const depthWidth = Math.min(((b.cumUsd / (maxCumQty * midPrice)) * 100), 100);
          const isWhale = b.qty >= avgOrderQty * WHALE_MULTIPLIER;
          return `
            <div class="dom-row bid-row ${isWhale ? 'whale-wall' : ''}">
              <div class="dom-depth-bg" style="width: ${depthWidth}%;"></div>
              <span class="price">${b.price.toFixed(2)}</span>
              <span class="size">${b.qty.toFixed(3)}</span>
              <span>${formatUsd(b.cumUsd)}</span>
            </div>
          `;
        }).join('');
      }

      function formatUsd(val) {
        if (val >= 1000000) return (val / 1000000).toFixed(2) + 'M';
        if (val >= 1000) return (val / 1000).toFixed(1) + 'K';
        return val.toFixed(0);
      }

      connectWebSocket();
    })();
  </script>

  <!-- 3. MULTI-PERSPECTIVE NEWS AGGREGATOR (WEST + NAHOST VOR ORT) -->
  <script>
    const FEEDS = [
      // --- WESTLICHE FINANZMEDIEN ---
      {
        name: "Investing.com (Commodities)",
        region: "West / Global",
        regionClass: "region-west",
        category: "Western Finance",
        url: "https://www.investing.com/rss/news_11.rss",
        bias_note: "Fokus: Globale Rohstoffmärkte & US-Makro"
      },
      {
        name: "Kitco Gold News",
        region: "USA / Kanada",
        regionClass: "region-west",
        category: "Western Finance",
        url: "https://www.kitco.com/rss/KitcoNews.xml",
        bias_note: "Fokus: Edelmetalle, Fed & Minen-Sektor"
      },

      // --- GOLF-FINANZEN (Das "Investing.com" des Nahen Ostens) ---
      {
        name: "Zawya (Middle East Markets)",
        region: "VAE / Golf",
        regionClass: "region-gulf",
        category: "Regional Finance",
        url: "https://www.zawya.com/en/rss",
        bias_note: "Golf-Ökonomie, Öl & institutionelle Flüsse"
      },
      {
        name: "Arab News (Economy & Oil)",
        region: "Saudi-Arabien",
        regionClass: "region-gulf",
        category: "Regional Finance",
        url: "https://www.arabnews.com/cat/4/rss.xml",
        bias_note: "Saudische Perspektive auf OPEC+ & Energie"
      },

      // --- GEOPOLITIK VOR ORT (Nahost, Iran, Israel, Katar) ---
      {
        name: "Al Jazeera English",
        region: "Katar / Nahost",
        regionClass: "region-mena",
        category: "Geopolitics",
        url: "https://www.aljazeera.com/xml/rss/all.xml",
        bias_note: "Direkte Vor-Ort-Korrespondenten im Nahen Osten"
      },
      {
        name: "Middle East Eye",
        region: "Nahost Fokus",
        regionClass: "region-mena",
        category: "Geopolitics",
        url: "https://www.middleeasteye.net/rss",
        bias_note: "Fokus: Rotes Meer, Jemen, Levante & Diplomatie"
      },
      {
        name: "Tehran Times",
        region: "Iran",
        regionClass: "region-iran",
        category: "Geopolitics",
        url: "https://www.tehrantimes.com/rss",
        bias_note: "Offizielle iranische Staatslinie & Militär-Statements"
      },
      {
        name: "Mehr News Agency",
        region: "Iran",
        regionClass: "region-iran",
        category: "Geopolitics",
        url: "https://en.mehrnews.com/rss",
        bias_note: "Direkte Meldungen aus Teheran"
      },
      {
        name: "The Times of Israel",
        region: "Israel",
        regionClass: "region-israel",
        category: "Geopolitics",
        url: "https://www.timesofisrael.com/feed/",
        bias_note: "Israelische Sicherheits- und Militärperspektive"
      }
    ];

    const MARKET_KEYWORDS = [
      "gold", "xau", "bullion", "oil", "brent", "crude", "opec", "energy",
      "hormuz", "red sea", "yemen", "houthi", "iran", "tehran", "israel", "idf",
      "missile", "strike", "attack", "drone", "sanction", "nuclear", "irgc",
      "escalat", "retaliat", "war", "truce", "ceasefire", "fed", "inflation",
      "rate", "central bank", "brics", "dollar", "treasury", "tariff", "saudi"
    ];

    let allArticles = [];
    let activeCategory = "ALL";

    function isMarketRelevant(title, description = "") {
      const text = (title + " " + description).toLowerCase();
      return MARKET_KEYWORDS.some(kw => text.includes(kw));
    }

    // Holt RSS-Feed über rss2json oder allorigins Fallback (CORS-frei für GitHub Pages)
    async function fetchFeed(feed) {
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
      try {
        const res = await fetch(proxyUrl);
        const data = await res.json();
        if (data.status === "ok" && data.items) {
          return data.items.slice(0, 10).map(item => ({
            title: item.title,
            link: item.link,
            pubDate: new Date(item.pubDate || Date.now()),
            description: item.description || "",
            sourceName: feed.name,
            region: feed.region,
            regionClass: feed.regionClass,
            category: feed.category,
            bias_note: feed.bias_note
          }));
        }
      } catch (e) {
        console.warn(`Feed-Fehler bei ${feed.name}:`, e);
      }
      return [];
    }

    async function loadAllFeeds() {
      const grid = document.getElementById("news-grid");
      const statusText = document.getElementById("last-updated-text");
      statusText.textContent = "Aktualisiere Feeds...";

      const results = await Promise.all(FEEDS.map(fetchFeed));
      allArticles = results.flat().sort((a, b) => b.pubDate - a.pubDate);

      const now = new Date().toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      statusText.textContent = `Letztes Update: ${now} Uhr (${allArticles.length} Artikel geladen)`;

      renderArticles();
    }

    function renderArticles() {
      const grid = document.getElementById("news-grid");
      const onlyImpact = document.getElementById("impact-filter-toggle").checked;

      const filtered = allArticles.filter(art => {
        const matchesCat = activeCategory === "ALL" || art.category === activeCategory;
        // Westliche Gold-Feeds immer durchlassen, Geopolitik/Regional nach Keywords filtern
        const matchesImpact = !onlyImpact || art.category === "Western Finance" || isMarketRelevant(art.title, art.description);
        return matchesCat && matchesImpact;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted);">Keine passenden Meldungen für diesen Filter gefunden. Deaktiviere testweise den Keyword-Filter oben rechts.</p>`;
        return;
      }

      grid.innerHTML = filtered.slice(0, 36).map(art => {
        const timeStr = isNaN(art.pubDate) ? "" : art.pubDate.toLocaleString("de-CH", {
          day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
        });
        return `
          <article class="news-card">
            <div>
              <div class="news-meta">
                <span class="source-tag">${art.sourceName}</span>
                <span class="region-badge ${art.regionClass}">${art.region}</span>
              </div>
              <a href="${art.link}" target="_blank" rel="noopener noreferrer" class="news-title">
                ${art.title}
              </a>
            </div>
            <div class="news-bias">
              <span>${art.bias_note}</span>
              <span>${timeStr}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    // Event-Listener für Tabs & Filter
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.getAttribute("data-filter");
        renderArticles();
      });
    });

    document.getElementById("impact-filter-toggle").addEventListener("change", renderArticles);
    document.getElementById("refresh-news-btn").addEventListener("click", loadAllFeeds);

    // Initialer Start + Auto-Refresh alle 3 Minuten
    loadAllFeeds();
    setInterval(loadAllFeeds, 180000);
  </script>
</body>
</html>
