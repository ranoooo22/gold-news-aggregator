name: Update Gold News

on:
  workflow_dispatch:

concurrency:
  group: gold-terminal-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests feedparser sentence-transformers google-genai torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run aggregator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: python aggregator.py

      - name: Commit and push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json market_data.json performance_stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update intelligence data"
            git pull --rebase -X ours origin main
            git push
          fi